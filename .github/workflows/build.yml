name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, build and verify the plugin
        run: ./gradlew test buildPlugin verifyPlugin
      - name: Report render benchmark
        if: always()
        run: cat build/reports/benchmark/render.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v6
        with:
          name: markdown-review-plugin
          path: build/distributions/*.zip
