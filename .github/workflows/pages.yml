name: Docs site

# Publishes site/ to GitHub Pages, with the screenshots and the icon from docs/. Pages must be set to deploy from
# GitHub Actions: Settings | Pages | Build and deployment | Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - docs/icon.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp -R site/. _site/
          cp docs/icon.png _site/
          cp docs/screenshots/*.png _site/screenshots/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
